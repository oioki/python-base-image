name: build-and-push

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/oioki/python-base-image/python
  TAG_BASE: 3.13-debian13

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: amd64
          - os: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.os }}
    name: build-${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distroless (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: application-distroless
          platforms: linux/${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG_BASE }}-${{ matrix.platform }}
            ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.platform }}
          cache-from: type=gha,scope=prod-${{ matrix.platform }}
          cache-to: type=gha,scope=prod-${{ matrix.platform }},mode=max

      - name: Build distroless-dev (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: application-distroless-dev
          platforms: linux/${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG_BASE }}-dev-${{ matrix.platform }}
            ${{ env.IMAGE }}:${{ github.sha }}-dev-${{ matrix.platform }}
          cache-from: type=gha,scope=dev-${{ matrix.platform }}
          cache-to: type=gha,scope=dev-${{ matrix.platform }},mode=max

  assemble:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Assemble multi-arch manifests
        run: |
          set -euo pipefail
          for suffix in "" "-dev"; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${TAG_BASE}${suffix}" \
              --tag "${IMAGE}:${GITHUB_SHA}${suffix}" \
              "${IMAGE}:${TAG_BASE}${suffix}-amd64" \
              "${IMAGE}:${TAG_BASE}${suffix}-arm64"
          done
